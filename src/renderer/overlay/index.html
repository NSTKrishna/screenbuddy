<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ScreenBuddy annotations</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      svg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .shape {
        fill: none;
        stroke: #a78bfa;
        stroke-width: 4;
        filter: drop-shadow(0 0 6px rgb(167 139 250 / 0.8));
      }
      .pulse {
        animation: pulse 1.2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes pulse {
        50% {
          opacity: 0.55;
        }
      }
      .label-bg {
        fill: rgb(17 18 24 / 0.92);
        stroke: rgb(167 139 250 / 0.7);
        stroke-width: 1;
      }
      .label {
        fill: #eceef2;
        font:
          600 13px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      .fading {
        transition: opacity 400ms ease;
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <marker
          id="head"
          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="5"
          markerHeight="5"
          orient="auto-start-reverse"
        >
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa" />
        </marker>
      </defs>
      <g id="shapes"></g>
    </svg>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
